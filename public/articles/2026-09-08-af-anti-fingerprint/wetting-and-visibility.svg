<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Serif KR', serif">
  <rect x="0.5" y="0.5" width="899" height="459" fill="#fdfdfc" stroke="#dcdcd6" stroke-width="1"/>

  <text x="28" y="46" font-size="26" font-weight="700" fill="#12120e" letter-spacing="-0.3">Same amount of oil, two different shapes</text>
  <text x="28" y="72" font-size="15" fill="#8a8a80" font-family="'IBM Plex Mono', monospace" letter-spacing="0.3">The coating does not block transfer. It changes how the residue sits.</text>

  <line x1="450" y1="96" x2="450" y2="430" stroke="#e4e4dc" stroke-width="1"/>

  <!-- ================= LEFT : bare glass ================= -->
  <text x="56" y="126" font-size="18" font-weight="700" fill="#12120e">Bare glass</text>
  <text x="56" y="148" font-size="14" fill="#8a8a80" font-family="'IBM Plex Mono', monospace">high surface energy</text>

  <!-- spread film -->
  <path d="M 76 236 Q 226 214 376 236 Z" fill="#c8a55e" opacity="0.8"/>
  <line x1="76" y1="236" x2="376" y2="236" stroke="#a8853e" stroke-width="1.2"/>

  <!-- substrate -->
  <rect x="56" y="236" width="340" height="30" fill="#dfe4ea" stroke="#b9c2cc" stroke-width="1"/>
  <text x="226" y="256" font-size="14" fill="#5a6470" text-anchor="middle" font-family="'IBM Plex Mono', monospace">GLASS</text>

  <!-- width bracket -->
  <line x1="76" y1="284" x2="376" y2="284" stroke="#8a8a80" stroke-width="1"/>
  <line x1="76" y1="278" x2="76" y2="290" stroke="#8a8a80" stroke-width="1"/>
  <line x1="376" y1="278" x2="376" y2="290" stroke="#8a8a80" stroke-width="1"/>

  <!-- numbers block -->
  <text x="56" y="316" font-size="16" fill="#7d4a44" font-family="'IBM Plex Mono', monospace">&#952; &lt; 10&#176;</text>
  <text x="176" y="316" font-size="16" fill="#4d4d45">wide contact, thin film</text>

  <!-- appearance -->
  <text x="56" y="352" font-size="13.5" fill="#8a8a80" font-family="'IBM Plex Mono', monospace" letter-spacing="0.6">HOW IT LOOKS ON A DARK SCREEN</text>
  <rect x="56" y="362" width="340" height="48" fill="#1b1b1e"/>
  <path d="M 84 386 Q 150 370 216 386 T 348 384" fill="none" stroke="#6c6c66" stroke-width="16" opacity="0.5" stroke-linecap="round"/>
  <text x="56" y="436" font-size="15" fill="#4d4d45">A broad haze</text>

  <!-- ================= RIGHT : AF coated ================= -->
  <text x="504" y="126" font-size="18" font-weight="700" fill="#12120e">AF-coated glass</text>
  <text x="504" y="148" font-size="14" fill="#8a8a80" font-family="'IBM Plex Mono', monospace">low surface energy</text>

  <!-- droplet -->
  <path d="M 640 236 A 40 40 0 1 1 716 236 Z" fill="#c8a55e" opacity="0.88"/>
  <path d="M 640 236 A 40 40 0 1 1 716 236" fill="none" stroke="#a8853e" stroke-width="1.2"/>

  <!-- AF layer + substrate -->
  <rect x="504" y="230" width="340" height="6" fill="#3f6f5a" opacity="0.9"/>
  <rect x="504" y="236" width="340" height="30" fill="#dfe4ea" stroke="#b9c2cc" stroke-width="1"/>
  <text x="674" y="256" font-size="14" fill="#5a6470" text-anchor="middle" font-family="'IBM Plex Mono', monospace">GLASS</text>
  <line x1="530" y1="233" x2="530" y2="200" stroke="#3f6f5a" stroke-width="1"/>
  <text x="504" y="194" font-size="14" fill="#3f6f5a" font-family="'IBM Plex Mono', monospace">AF layer 10 &#8211; 15 nm</text>

  <!-- width bracket -->
  <line x1="640" y1="284" x2="716" y2="284" stroke="#8a8a80" stroke-width="1"/>
  <line x1="640" y1="278" x2="640" y2="290" stroke="#8a8a80" stroke-width="1"/>
  <line x1="716" y1="278" x2="716" y2="290" stroke="#8a8a80" stroke-width="1"/>

  <!-- numbers block -->
  <text x="504" y="316" font-size="16" fill="#7d4a44" font-family="'IBM Plex Mono', monospace">&#952; = 65&#176;</text>
  <text x="612" y="316" font-size="16" fill="#4d4d45">narrow contact, rolls off at 6&#176; tilt</text>

  <!-- appearance -->
  <text x="504" y="352" font-size="13.5" fill="#8a8a80" font-family="'IBM Plex Mono', monospace" letter-spacing="0.6">HOW IT LOOKS ON A DARK SCREEN</text>
  <rect x="504" y="362" width="340" height="48" fill="#1b1b1e"/>
  <g fill="#6c6c66" opacity="0.55">
    <ellipse cx="576" cy="386" rx="9" ry="7"/>
    <ellipse cx="628" cy="380" rx="7" ry="6"/>
    <ellipse cx="680" cy="390" rx="9" ry="7"/>
    <ellipse cx="736" cy="382" rx="7" ry="6"/>
    <ellipse cx="792" cy="388" rx="8" ry="6.5"/>
  </g>
  <text x="504" y="436" font-size="15" fill="#4d4d45">A few separate marks</text>

  <text x="872" y="452" font-size="13" fill="#b0b0a6" text-anchor="end" font-family="'IBM Plex Mono', monospace">Contact angles from Daikin Optool TDS</text>
</svg>
