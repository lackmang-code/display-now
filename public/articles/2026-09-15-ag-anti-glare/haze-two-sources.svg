  <text x="353.5" y="564" font-size="15.6" fill="#7a6a3c" text-anchor="middle">0.32 to 3.14 by changing only the particle surface treatment</text>
  <text x="60" y="602" font-size="14.5" fill="#4d4d45">The inner-led film puts 10 to 13% surface haze inside a 40 to 50% total. The surface-led film keeps inner haze</text>
  <text x="60" y="622" font-size="14.5" fill="#4d4d45">at 1 to 25% of the total. Values from film makers&#8217; published specifications; the first ratio is our own arithmetic.</text>
