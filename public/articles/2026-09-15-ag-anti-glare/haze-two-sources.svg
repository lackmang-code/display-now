  <text x="94" y="328" font-size="14.5" fill="#4d4d45">bends at the air interface</text>
  <text x="286" y="308" font-size="15.6" fill="#3f5f8c" font-family="'IBM Plex Mono', monospace">INNER HAZE</text>
  <text x="286" y="328" font-size="14.5" fill="#4d4d45">bends at a particle inside</text>

  <rect x="510" y="128" width="362" height="172" fill="#f4f2ea" stroke="#dcdcd6" stroke-width="1"/>
  <text x="530" y="158" font-size="15.6" font-weight="700" fill="#12120e" font-family="'IBM Plex Mono', monospace">HOW THEY ARE SEPARATED</text>
  <text x="530" y="188" font-size="15.6" fill="#4d4d45">1. Measure total haze</text>
  <text x="530" y="214" font-size="15.6" fill="#4d4d45">2. Attach a zero-haze adhesive film to</text>
  <text x="548" y="234" font-size="15.6" fill="#4d4d45">flatten the surface, measure again.</text>
  <text x="548" y="254" font-size="15.6" fill="#4d4d45">That is the inner haze</text>
  <text x="530" y="280" font-size="15.6" fill="#4d4d45">3. Outer haze = total minus inner</text>
  <text x="530" y="328" font-size="13.5" fill="#8a8a80" font-family="'IBM Plex Mono', monospace">HM-150 &#183; JIS K 7136 &#183; 4 &#215; 4 cm &#183; n = 3</text>

