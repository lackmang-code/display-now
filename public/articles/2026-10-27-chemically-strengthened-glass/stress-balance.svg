<rect x="0.5" y="0.5" width="899" height="499" fill="#ffffff" stroke="#d9dde3"/>
<text x="32" y="46" font-size="27" font-weight="700" fill="#151a22" letter-spacing="-0.3">Compression is borrowed from the middle</text>
<text x="32" y="76" font-size="17" fill="#5b6474">Linear profile, t = 550 µm, CS 750 MPa, DOL 30 µm. No outside force, so the areas cancel.</text>
