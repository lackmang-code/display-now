<text x="138.0" y="372.0" font-size="16" fill="#e5482a" text-anchor="start" font-weight="700" >tension, MPa (drawn 5× taller)</text>
<text x="820.0" y="372.0" font-size="15" fill="#5b6474" text-anchor="end" font-weight="500" >depth through the 550 µm thickness →</text>
<text x="183.6" y="166.0" font-size="18" fill="#2563eb" text-anchor="start" font-weight="700" >CS 750</text>
<text x="183.6" y="190.0" font-size="17" fill="#2563eb" text-anchor="start" font-weight="500" >area A = ½ · CS · DOL</text>
<text x="766.4" y="190.0" font-size="17" fill="#2563eb" text-anchor="end" font-weight="500" >area A</text>
<rect x="278.6" y="306.0" width="392.8" height="22.1" rx="5" fill="#ffffff" opacity="0.92"/><text x="475.0" y="320.0" font-size="17" fill="#e5482a" text-anchor="middle" font-weight="700" >CT 46 MPa, strip area = CT · (t − 2·DOL)</text>
<rect x="200" y="400" width="500" height="64" rx="8" fill="#ffffff" stroke="#d9dde3"/>
<text x="450.0" y="426.0" font-size="17" fill="#151a22" text-anchor="middle" font-weight="700" >two triangles (2A) = strip  →  CT = CS·DOL / (t − 2·DOL)</text>
<text x="450.0" y="452.0" font-size="16" fill="#5b6474" text-anchor="middle" font-weight="500" >750 × 30 / 490 = 46 MPa</text>
