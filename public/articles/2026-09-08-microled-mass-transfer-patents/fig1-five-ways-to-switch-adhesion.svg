<svg viewBox="0 0 650 700" width="650" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#b4552f"/></marker></defs><text x="8" y="26" font-size="15" font-weight="700" fill="#12120e">Five ways to switch adhesion on and off</text><text x="8" y="48" font-size="11.5" fill="#8a8a80">Orange marks the knob that releases the device. Left column: picking up. Right column: releasing.</text><text x="300" y="76" font-size="12" font-weight="700" fill="#8a8a80" text-anchor="middle">PICK UP</text><text x="520" y="76" font-size="12" font-weight="700" fill="#8a8a80" text-anchor="middle">RELEASE</text><line x1="8" y1="87" x2="642" y2="87" stroke="#e6e6e0" stroke-width="1"/><text x="8" y="111" font-size="14" fill="#12120e" text-anchor="start" font-weight="700">Elastomer stamp</text><text x="8" y="133" font-size="12" fill="#b4552f" text-anchor="start" font-weight="700">Knob: peel rate</text><text x="8" y="153" font-size="11" fill="#8a8a80" text-anchor="start" font-weight="400">Speed is the knob,<tspan> </tspan>so speed is capped</text><rect x="245" y="107" width="110" height="20" rx="3" fill="oklch(0.45 0.10 150)"/><rect x="267" y="127" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="291" y="127" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="315" y="127" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><path d="M368 135 L368 105" stroke="#b4552f" stroke-width="2" marker-end="url(#ar)"/><text x="372" y="125" font-size="11" fill="#b4552f" text-anchor="start" font-weight="700">FAST</text><text x="300" y="165" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">device follows the stamp</text><rect x="465" y="107" width="110" height="20" rx="3" fill="oklch(0.45 0.10 150)"/><rect x="487" y="147" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="511" y="147" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="535" y="147" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="465" y="159" width="110" height="8" fill="#c9c9c4"/><path d="M588 135 L588 105" stroke="#b4552f" stroke-width="2" marker-end="url(#ar)"/><text x="592" y="125" font-size="11" fill="#b4552f" text-anchor="start" font-weight="700">SLOW</text><text x="520" y="183" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">device stays behind</text><line x1="8" y1="212" x2="642" y2="212" stroke="#e6e6e0" stroke-width="1"/><text x="8" y="236" font-size="14" fill="#12120e" text-anchor="start" font-weight="700">Electrostatic head</text><text x="8" y="258" font-size="12" fill="#b4552f" text-anchor="start" font-weight="700">Knob: voltage</text><text x="8" y="278" font-size="11" fill="#8a8a80" text-anchor="start" font-weight="400">Head must be built<tspan> </tspan>in a fab</text><rect x="245" y="232" width="110" height="20" rx="3" fill="oklch(0.45 0.10 150)"/><text x="278" y="247" font-size="13" fill="#fff" text-anchor="middle" font-weight="400">+</text><text x="322" y="247" font-size="13" fill="#fff" text-anchor="middle" font-weight="400">&#8722;</text><rect x="267" y="252" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="291" y="252" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="315" y="252" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><text x="300" y="290" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">voltage ON</text><rect x="465" y="232" width="110" height="20" rx="3" fill="oklch(0.45 0.10 150)"/><rect x="487" y="272" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="511" y="272" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="535" y="272" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="465" y="284" width="110" height="8" fill="#c9c9c4"/><text x="520" y="308" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">voltage OFF</text><line x1="8" y1="337" x2="642" y2="337" stroke="#e6e6e0" stroke-width="1"/><text x="8" y="361" font-size="14" fill="#12120e" text-anchor="start" font-weight="700">Laser</text><text x="8" y="383" font-size="12" fill="#b4552f" text-anchor="start" font-weight="700">Knob: release layer</text><text x="8" y="403" font-size="11" fill="#8a8a80" text-anchor="start" font-weight="400">One&#8209;way. cannot<tspan> </tspan>re&#8209;grip</text><rect x="245" y="357" width="110" height="20" rx="3" fill="#8a8a80"/><rect x="245" y="377" width="110" height="5" fill="#b4552f"/><rect x="267" y="383" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="291" y="383" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="315" y="383" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><text x="300" y="415" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">held by release layer</text><rect x="465" y="357" width="110" height="20" rx="3" fill="#8a8a80"/><rect x="465" y="377" width="110" height="5" fill="#b4552f" opacity="0.25"/><path d="M520 343 L520 373" stroke="#b4552f" stroke-width="2.4" marker-end="url(#ar)"/><rect x="487" y="397" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="511" y="397" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="535" y="397" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="465" y="409" width="110" height="8" fill="#c9c9c4"/><text x="520" y="433" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">layer decomposes</text><line x1="8" y1="462" x2="642" y2="462" stroke="#e6e6e0" stroke-width="1"/><text x="8" y="486" font-size="14" fill="#12120e" text-anchor="start" font-weight="700">Vacuum (porous anodic film)</text><text x="8" y="508" font-size="12" fill="#b4552f" text-anchor="start" font-weight="700">Knob: suction</text><text x="8" y="528" font-size="11" fill="#8a8a80" text-anchor="start" font-weight="400">No charge,<tspan> </tspan>so no LED damage</text><rect x="245" y="482" width="110" height="20" rx="3" fill="oklch(0.45 0.10 150)"/><line x1="256" y1="482" x2="256" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="267" y1="482" x2="267" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="278" y1="482" x2="278" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="289" y1="482" x2="289" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="300" y1="482" x2="300" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="311" y1="482" x2="311" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="322" y1="482" x2="322" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="333" y1="482" x2="333" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="344" y1="482" x2="344" y2="502" stroke="#fff" stroke-width="1.4"/><rect x="267" y="502" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="291" y="502" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="315" y="502" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><path d="M368 504 L368 478" stroke="#b4552f" stroke-width="2" marker-end="url(#ar)"/><text x="372" y="496" font-size="11" fill="#b4552f" text-anchor="start" font-weight="700">ON</text><text x="300" y="540" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">air pulled through pores</text><rect x="465" y="482" width="110" height="20" rx="3" fill="oklch(0.45 0.10 150)"/><line x1="476" y1="482" x2="476" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="487" y1="482" x2="487" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="498" y1="482" x2="498" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="509" y1="482" x2="509" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="520" y1="482" x2="520" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="531" y1="482" x2="531" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="542" y1="482" x2="542" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="553" y1="482" x2="553" y2="502" stroke="#fff" stroke-width="1.4"/><line x1="564" y1="482" x2="564" y2="502" stroke="#fff" stroke-width="1.4"/><rect x="487" y="522" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="511" y="522" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="535" y="522" width="17" height="9" rx="1.5" fill="#12120e" opacity="1.0"/><rect x="465" y="534" width="110" height="8" fill="#c9c9c4"/><text x="592" y="496" font-size="11" fill="#8a8a80" text-anchor="start" font-weight="700">OFF</text><text x="520" y="558" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">suction released</text><line x1="8" y1="587" x2="642" y2="587" stroke="#e6e6e0" stroke-width="1"/><text x="8" y="611" font-size="14" fill="#12120e" text-anchor="start" font-weight="700">Fluidic assembly</text><text x="8" y="633" font-size="12" fill="#b4552f" text-anchor="start" font-weight="700">Knob: none. never picks up</text><text x="8" y="653" font-size="11" fill="#8a8a80" text-anchor="start" font-weight="400">Capture speed vs.<tspan> </tspan>assembly speed</text><path d="M242 613 q 15 -8 29 0 q 15 8 29 0 q 15 -8 29 0" stroke="#7fa8c4" stroke-width="1.8" fill="none"/><rect x="267" y="621" width="17" height="9" rx="1.5" fill="#12120e" opacity="0.5"/><rect x="291" y="621" width="17" height="9" rx="1.5" fill="#12120e" opacity="0.5"/><rect x="315" y="621" width="17" height="9" rx="1.5" fill="#12120e" opacity="0.5"/><rect x="245" y="639" width="110" height="22" fill="#c9c9c4"/><rect x="260" y="639" width="21" height="13" fill="#fbfbfa"/><rect x="290" y="639" width="21" height="13" fill="#fbfbfa"/><rect x="320" y="639" width="21" height="13" fill="#fbfbfa"/><text x="300" y="677" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">devices drift in liquid</text><rect x="465" y="639" width="110" height="22" fill="#c9c9c4"/><rect x="480" y="639" width="21" height="13" fill="#fbfbfa"/><rect x="510" y="639" width="21" height="13" fill="#fbfbfa"/><rect x="540" y="639" width="21" height="13" fill="#fbfbfa"/><rect x="482" y="641" width="17" height="9" rx="1.5" fill="#12120e"/><rect x="512" y="641" width="17" height="9" rx="1.5" fill="#12120e"/><rect x="542" y="641" width="17" height="9" rx="1.5" fill="#12120e"/><text x="520" y="677" font-size="11" fill="#8a8a80" text-anchor="middle" font-weight="400">shape&#8209;matched wells trap them</text></svg>