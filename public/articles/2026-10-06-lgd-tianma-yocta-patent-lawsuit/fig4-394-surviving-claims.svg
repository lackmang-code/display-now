<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<rect width="690" height="346" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="16" fill="#1d2330" font-weight="700" text-anchor="start">What survived examination in LG Display’s ’394 patent</text>
<text x="20.0" y="47.0" font-size="12" fill="#5b6474" font-weight="400" text-anchor="start">Redrawn from US11251394 FIG. 2. Gray parts were found by the examiner in Samsung’s Kang651.</text>
<g transform="translate(0,-130)">
<rect x="60.0" y="380.0" width="520.0" height="24.0" fill="#cfd4dc" />
<text x="320.0" y="396.0" font-size="11" fill="#1d2330" font-weight="600" text-anchor="middle">Substrate + TFT</text>
<rect x="95.0" y="368.0" width="100.0" height="8.0" fill="#bfc6d0" />
<rect x="260.0" y="368.0" width="100.0" height="8.0" fill="#bfc6d0" />
<rect x="425.0" y="368.0" width="100.0" height="8.0" fill="#bfc6d0" />
<path d="M60 380 L68 342 L82 342 L90 380 Z" fill="#a9b2bf"/>
<path d="M200 380 L208 342 L247 342 L255 380 Z" fill="#a9b2bf"/>
<path d="M365 380 L373 342 L412 342 L420 380 Z" fill="#a9b2bf"/>
<path d="M530 380 L538 342 L572 342 L580 380 Z" fill="#a9b2bf"/>
<text x="227.0" y="370.0" font-size="11" fill="#1d2330" font-weight="600" text-anchor="middle">bank</text>
<rect x="60.0" y="334.0" width="520.0" height="8.0" fill="#d8c3cf" />
<text x="45.0" y="341.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="end">cathode</text>
<rect x="60.0" y="302.0" width="520.0" height="32.0" fill="#e3e6eb" />
<text x="320.0" y="322.0" font-size="11" fill="#1d2330" font-weight="600" text-anchor="middle">Encapsulation unit (inorganic / organic / inorganic)</text>
<path d="M580 302 L640 380 L580 380 Z" fill="#e3e6eb"/>
<rect x="80.0" y="292.0" width="125.0" height="8.0" fill="#bfc6d0" />
<rect x="255.0" y="292.0" width="125.0" height="8.0" fill="#bfc6d0" />
<rect x="420.0" y="292.0" width="125.0" height="8.0" fill="#bfc6d0" />
<text x="142.0" y="286.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="middle">touch electrodes</text>
<rect x="205.0" y="282.0" width="45.0" height="8.0" fill="#b4552d" />
<line x1="227" y1="282" x2="227" y2="236" stroke="#b4552d" stroke-width="1.5"/>
<text x="227.0" y="216.0" font-size="12" fill="#b4552d" font-weight="700" text-anchor="middle">Bridge overlaps the bank</text>
<text x="227.0" y="231.0" font-size="11" fill="#b4552d" font-weight="400" text-anchor="middle">(original claim 10, now claim 1)</text>
<line x1="227" y1="290" x2="227" y2="344" stroke="#b4552d" stroke-dasharray="3 3"/>
<path d="M560 299 L582 299 L642 378 L662 378" fill="none" stroke="#2f6f4f" stroke-width="5"/>
<rect x="650.0" y="374.0" width="26.0" height="10.0" fill="#8f98a5" />
<text x="663.0" y="402.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="middle">touch pad</text>
<text x="590.0" y="236.0" font-size="12" fill="#2f6f4f" font-weight="700" text-anchor="middle">Routing line along the side of</text>
<text x="590.0" y="251.0" font-size="11" fill="#2f6f4f" font-weight="400" text-anchor="middle">the encapsulation (claim 19)</text>
<line x1="612" y1="256" x2="612" y2="334" stroke="#2f6f4f" stroke-width="1.5"/>
<text x="20.0" y="440.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">Everything else in the original claims (touch sensors on the encapsulation, bridges, two conductive</text>
<text x="20.0" y="456.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">lines with an insulating film, pads) was held anticipated by Samsung Display’s US20170090651.</text>
</g>
