<text x="619.4" y="420.0" font-size="11" fill="#1d2330" font-weight="400" text-anchor="end">of US12386474</text>
<text x="20.0" y="448.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">Kodak 2002 sealed with a glass cap, not a thin film. The 2007 Samsung claim is a resistive (press) touch.</text>
