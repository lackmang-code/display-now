<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 778" role="img" aria-labelledby="t d"><title id="t">Chain of evidence from light modulation to headache</title><desc id="d">Five boxes in a vertical chain: temporal light modulation, phantom array during saccades, visual cortex response, visual discomfort, headache. Links are labelled shown, hypothesis, association with cause not established, and reported after exposure.</desc><rect width="760" height="778" fill="#fbfaf7"/>
<rect x="60" y="20" width="640" height="98" rx="6" fill="#e7dcee" stroke="#6b3a8c" stroke-width="3"/>
<text x="80" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#6b3a8c">Temporal light modulation</text>
<text x="80" y="96" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#1a1a17">frequency, modulation depth, duty cycle</text>
<line x1="120" y1="124" x2="120" y2="174" stroke="#1a1a17" stroke-width="3"/><polygon points="120,176 110,160 130,160" fill="#1a1a17"/>
<text x="150" y="157.0" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#6b3a8c">shown</text>
<rect x="60" y="180" width="640" height="98" rx="6" fill="#e7dcee" stroke="#6b3a8c" stroke-width="3"/>
<text x="80" y="218" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#6b3a8c">Phantom array during saccades</text>
<text x="80" y="256" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#1a1a17">visible above 200 Hz with edges (Davis 2015); PNNL 2024</text>
<line x1="120" y1="284" x2="120" y2="334" stroke="#1a1a17" stroke-width="3"/><polygon points="120,336 110,320 130,320" fill="#1a1a17"/>
<text x="150" y="317.0" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#55554f">hypothesis</text>
<rect x="60" y="340" width="640" height="98" rx="6" fill="#e7dcee" stroke="#6b3a8c" stroke-width="3"/>
<text x="80" y="378" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#6b3a8c">Visual cortex response</text>
<text x="80" y="416" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#1a1a17">ssVEP tracks discomfort, R² = 0.83, tested at 1.6-30 Hz</text>
<line x1="120" y1="444" x2="120" y2="494" stroke="#1a1a17" stroke-width="3"/><polygon points="120,496 110,480 130,480" fill="#1a1a17"/>
<text x="150" y="477.0" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#55554f">association, cause not established</text>
<rect x="60" y="500" width="640" height="98" rx="6" fill="#e7dcee" stroke="#6b3a8c" stroke-width="3"/>
<text x="80" y="538" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#6b3a8c">Visual discomfort</text>
<text x="80" y="576" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#1a1a17">rating scale in lab studies</text>
<line x1="120" y1="604" x2="120" y2="654" stroke="#1a1a17" stroke-width="3"/><polygon points="120,656 110,640 130,640" fill="#1a1a17"/>
<text x="150" y="637.0" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#55554f">reported after exposure</text>
<rect x="60" y="660" width="640" height="98" rx="6" fill="#e7dcee" stroke="#55554f" stroke-width="3"/>
<text x="80" y="698" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#55554f">Headache</text>
<text x="80" y="736" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#1a1a17">PNNL 2024: 41% vs 8% within 4 h, not designed to test cause</text>
</svg>