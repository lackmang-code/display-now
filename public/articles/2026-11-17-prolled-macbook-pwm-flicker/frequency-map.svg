<rect x="191.6" y="168" width="49.1" height="22" fill="#6b3a8c"/>
<text x="40" y="244" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">Magnetic-ballast fluorescent lamps</text>
<circle cx="356.2" cy="267" r="10" fill="#6b3a8c"/>
<circle cx="368.7" cy="267" r="10" fill="#6b3a8c"/>
<text x="362.7" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#6b3a8c">100 and 120</text>
<text x="40" y="332" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">Flicker seen with edges and saccades</text>
<rect x="403.8" y="344" width="62.9" height="22" fill="#6b3a8c"/>
<rect x="466.7" y="344" width="32.3" height="22" fill="#c9b6d6"/>
<text x="40" y="420" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">Phantom array, annoyance 4.7 or more</text>
