<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 766" role="img" aria-labelledby="t d"><title id="t">Frequency map of flicker findings</title><desc id="d">Log frequency axis with bands for visible flicker, discomfort peaks, fluorescent lamps, saccade visibility, phantom array annoyance, display PWM examples and the IEEE 1789 low-risk frequency.</desc><rect width="760" height="766" fill="#fbfaf7"/>
<line x1="40.0" y1="40" x2="40.0" y2="656" stroke="#d8d6cf" stroke-width="1.5"/>
<text x="40.0" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">1</text>
<line x1="198.1" y1="40" x2="198.1" y2="656" stroke="#d8d6cf" stroke-width="1.5"/>
<text x="198.1" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">10</text>
<line x1="356.2" y1="40" x2="356.2" y2="656" stroke="#d8d6cf" stroke-width="1.5"/>
<text x="356.2" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">100</text>
<line x1="514.3" y1="40" x2="514.3" y2="656" stroke="#d8d6cf" stroke-width="1.5"/>
<text x="514.3" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">1,000</text>
<line x1="672.4" y1="40" x2="672.4" y2="656" stroke="#d8d6cf" stroke-width="1.5"/>
<text x="672.4" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">10,000</text>
<text x="720" y="726" text-anchor="end" font-family="Arial,sans-serif" font-size="22" font-weight="normal" fill="#55554f">Frequency (Hz, log scale)</text>
<text x="40" y="68" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">Visible flicker, typical (below ~80 Hz)</text>
<rect x="40.0" y="80" width="300.9" height="22" fill="#6b3a8c"/>
<text x="40" y="156" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#1a1a17">Discomfort rating peaks (tested 1.6-30 Hz)</text>
