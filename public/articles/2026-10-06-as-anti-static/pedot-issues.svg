  <text x="117.14285714285714" y="136" font-size="15" fill="#c0642b" font-weight="700">standard grades 1.0–2.5</text>
  <rect x="345.7142857142857" y="144" width="171.4285714285714" height="14" rx="3" fill="#2f7d5c"/>
  <text x="345.7142857142857" y="136" font-size="15" fill="#2f7d5c" font-weight="700">neutralized grade 5–8</text>
  <rect x="60" y="252" width="800" height="70" rx="6" fill="#f6f5f0" stroke="#e3e1d8"/>
  <text x="76" y="280" font-size="15" fill="#4d4d45">Indium etched out of ITO underneath</text>
