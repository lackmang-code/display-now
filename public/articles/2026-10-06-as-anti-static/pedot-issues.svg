  <text x="440" y="306" font-size="17" fill="#c0642b" font-family="'IBM Plex Mono', monospace" font-weight="700">dissolved</text>
  <text x="560" y="306" font-size="15" fill="#2f7d5c" font-family="'IBM Plex Mono', monospace">→ almost no change when neutralized</text>
  <text x="28" y="372" font-size="18" fill="#12120e" font-family="'Noto Serif KR', serif" font-weight="700">B. Sheet resistance drifts up over time and heat</text>
