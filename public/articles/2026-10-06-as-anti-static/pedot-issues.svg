  <text x="493" y="540" font-size="14" fill="#8a8a80" text-anchor="middle" font-family="'IBM Plex Mono', monospace">95 °C</text>
  <circle cx="620" cy="461.0" r="6" fill="#fff" stroke="#c0642b" stroke-width="2.2"/>
  <circle cx="666" cy="445.4" r="6" fill="#c0642b"/>
  <line x1="626" y1="461.0" x2="660" y2="445.4" stroke="#c0642b" stroke-width="2"/>
  <text x="643" y="522" font-size="15" fill="#12120e" text-anchor="middle" font-weight="700">PEDOT film</text>
  <text x="643" y="540" font-size="14" fill="#8a8a80" text-anchor="middle" font-family="'IBM Plex Mono', monospace">95 °C</text>
  <circle cx="770" cy="461.0" r="6" fill="#fff" stroke="#2f7d5c" stroke-width="2.2"/>
