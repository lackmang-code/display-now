  <text x="793" y="540" font-size="14" fill="#8a8a80" text-anchor="middle" font-family="'IBM Plex Mono', monospace">105 °C, 1500 h</text>
  <text x="28" y="572" font-size="14.5" fill="#8a8a80" font-family="'IBM Plex Mono', monospace">A: lab studies of PEDOT:PSS on ITO and silver nanowire. B: mixed sources and conditions;</text>
