<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <rect width="680" height="420" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1d2330">Who claimed the joint between tandem units</text>
  <text x="20" y="47" font-size="12" fill="#5b6474">Priority dates of the patents cited in this article. One marker = one patent family.</text>
  <text x="20" y="92" font-size="12" font-weight="700" fill="#5b6474">ORIGIN</text>
  <text x="20" y="226" font-size="12" font-weight="700" fill="#5b6474">KOREA</text>
  <text x="20" y="318" font-size="12" font-weight="700" fill="#5b6474">CHINA</text>
  <line x1="20" y1="160" x2="660" y2="160" stroke="#e3e6ec"/>
  <line x1="20" y1="262" x2="660" y2="262" stroke="#e3e6ec"/>
  <line x1="90" y1="366" x2="660" y2="366" stroke="#1d2330"/>
  <g font-size="11" fill="#5b6474" text-anchor="middle">
    <line x1="90" y1="366" x2="90" y2="372" stroke="#1d2330"/><text x="90" y="386">1996</text>
    <line x1="182" y1="366" x2="182" y2="372" stroke="#1d2330"/><text x="182" y="386">2000</text>
    <line x1="274" y1="366" x2="274" y2="372" stroke="#1d2330"/><text x="274" y="386">2004</text>
    <line x1="366" y1="366" x2="366" y2="372" stroke="#1d2330"/><text x="366" y="386">2008</text>
    <line x1="458" y1="366" x2="458" y2="372" stroke="#1d2330"/><text x="458" y="386">2012</text>
    <line x1="550" y1="366" x2="550" y2="372" stroke="#1d2330"/><text x="550" y="386">2016</text>
    <line x1="642" y1="366" x2="642" y2="372" stroke="#1d2330"/><text x="642" y="386">2020</text>
  </g>
  <g font-size="11" fill="#1d2330">
    <circle cx="125" cy="74" r="5" fill="#8a8f99"/>
    <text x="133" y="70" font-weight="700">1997 eMagin</text>
    <text x="133" y="84">metal conductor</text>
    <circle cx="148" cy="124" r="5" fill="#8a8f99"/>
    <text x="156" y="120" font-weight="700">1998 Idemitsu</text>
    <text x="156" y="134">conductive, equipotential</text>
    <circle cx="228" cy="74" r="6" fill="#2f6f4f"/>
    <text x="238" y="70" font-weight="700">2002-02 Kodak (Liao, Tang)</text>
    <text x="238" y="84">doped organic connector: n + p</text>
    <circle cx="230" cy="124" r="5" fill="#b4552d"/>
    <text x="298" y="120" font-weight="700">2002-03 Kido</text>
    <text x="298" y="134">insulating CGL, &#8805;10&#178; &#937;&#183;cm</text>
    <line x1="235" y1="124" x2="294" y2="124" stroke="#b4552d" stroke-dasharray="3 2"/>
    <circle cx="284" cy="150" r="5" fill="#2f6f4f"/>
    <text x="410" y="154" font-weight="700">2004 Kodak</text>
    <text x="478" y="154">"no direct connection to power"</text>
    <line x1="289" y1="150" x2="406" y2="150" stroke="#2f6f4f" stroke-dasharray="3 2"/>
    <circle cx="476" cy="98" r="5" fill="#5a4fb0"/>
    <text x="484" y="94" font-weight="700">2012 SEL-Sharp</text>
    <text x="484" y="108">overhang cuts the joint</text>
  </g>
  <g font-size="11" fill="#1d2330">
    <circle cx="272" cy="200" r="6" fill="#1d4fa8"/>
    <text x="282" y="196" font-weight="700">2003-12 LG Display</text>
    <text x="282" y="210">first CGL tandem claim</text>
    <rect x="481" y="224" width="92" height="12" rx="2" fill="#2f6f4f" opacity="0.35"/>
    <text x="481" y="250">2013–16 CGL tuning peaks</text>
    <rect x="573" y="182" width="87" height="12" rx="2" fill="#b4552d" opacity="0.35"/>
    <text x="660" y="208" text-anchor="end">2017– pixel structures</text>
  </g>
  <g font-size="11" fill="#1d2330">
    <circle cx="389" cy="298" r="6" fill="#c0392b"/>
    <text x="397" y="294" font-weight="700">2008-12 CAS Changchun,</text>
    <text x="397" y="308" font-weight="700">Tsinghua + Visionox</text>
    <circle cx="504" cy="336" r="6" fill="#c0392b"/>
    <text x="512" y="334" font-weight="700">2013-12 BOE</text><text x="512" y="348">first panel maker</text>
  </g>
  <g font-size="11" fill="#1d2330">
    <text x="660" y="410" text-anchor="end" fill="#5b6474">Kodak's 2002 patent (US6872472) expired 2022-04-26. Axis ends at 2020 for space.</text>
  </g>
</svg>
