<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="680" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#1d2330">Two answers to lateral leakage through the CGL</text>
  <text x="20" y="47" font-size="12" fill="#5b6474">Schematic cross-sections of two neighboring subpixels. Not to scale.</text>
  <text x="20" y="82" font-size="13.5" font-weight="700" fill="#1d2330">A. Cut the CGL between pixels</text>
  <text x="352" y="82" font-size="13.5" font-weight="700" fill="#1d2330">B. Pin the CGL to a fixed potential</text>
  <g>
    <rect x="20" y="300" width="310" height="16" fill="#8a8f99"/>
    <text x="175" y="312" font-size="10.5" fill="#ffffff" text-anchor="middle">substrate</text>
    <rect x="34" y="286" width="112" height="14" fill="#c9a227"/>
    <rect x="204" y="286" width="112" height="14" fill="#c9a227"/>
    <text x="90" y="296.5" font-size="10" fill="#1d2330" text-anchor="middle">anode, pixel 1 ON</text>
    <text x="260" y="296.5" font-size="10" fill="#1d2330" text-anchor="middle">anode, pixel 2 OFF</text>
    <path d="M160 300 L160 240 L150 240 L150 232 L200 232 L200 240 L190 240 L190 300 z" fill="#5b6474"/>
    <text x="175" y="239" font-size="9" fill="#ffffff" text-anchor="middle">overhang</text>
    <rect x="34" y="258" width="112" height="28" fill="#7fa7e0"/>
    <rect x="204" y="258" width="112" height="28" fill="#7fa7e0"/>
    <text x="90" y="276" font-size="10.5" fill="#1d2330" text-anchor="middle">unit 1</text>
    <text x="260" y="276" font-size="10.5" fill="#1d2330" text-anchor="middle">unit 1</text>
    <rect x="34" y="250" width="112" height="8" fill="#2f6f4f"/>
    <rect x="204" y="250" width="112" height="8" fill="#2f6f4f"/>
    <text x="40" y="246" font-size="10.5" font-weight="700" fill="#2f6f4f">CGL</text>
    <rect x="34" y="198" width="296" height="30" fill="#b9cdea" opacity="0.9"/>
    <text x="100" y="217" font-size="10.5" fill="#1d2330" text-anchor="middle">unit 2</text>
    <rect x="20" y="186" width="310" height="12" fill="#c9a227"/>
    <text x="175" y="195.5" font-size="10" fill="#1d2330" text-anchor="middle">common cathode</text>
    <line x1="120" y1="254" x2="196" y2="254" stroke="#c0392b" stroke-width="2" marker-end="url(#ah)"/>
    <text x="175" y="344" font-size="30" font-weight="700" fill="#c0392b" text-anchor="middle">&#215;</text>
    <text x="20" y="364" font-size="11.5" fill="#1d2330">The CGL film is broken at the pixel edge,</text>
    <text x="20" y="380" font-size="11.5" fill="#1d2330">so the sideways path does not exist.</text>
  </g>
  <g>
    <rect x="352" y="300" width="310" height="16" fill="#8a8f99"/>
    <text x="507" y="312" font-size="10.5" fill="#ffffff" text-anchor="middle">substrate</text>
    <rect x="366" y="286" width="112" height="14" fill="#c9a227"/>
    <rect x="536" y="286" width="112" height="14" fill="#c9a227"/>
    <text x="422" y="296.5" font-size="10" fill="#1d2330" text-anchor="middle">anode, pixel 1 ON</text>
    <text x="592" y="296.5" font-size="10" fill="#1d2330" text-anchor="middle">anode, pixel 2 OFF</text>
    <rect x="490" y="258" width="34" height="42" fill="#1d4fa8"/>
    <text x="507" y="334" font-size="10" fill="#1d4fa8" text-anchor="middle">fixed-potential line</text>
    <text x="507" y="346" font-size="10" fill="#1d4fa8" text-anchor="middle">(cathode tie, reset or auxiliary)</text>
    <line x1="507" y1="318" x2="507" y2="324" stroke="#1d4fa8"/>
    <rect x="366" y="258" width="112" height="28" fill="#7fa7e0"/>
    <rect x="536" y="258" width="112" height="28" fill="#7fa7e0"/>
    <text x="422" y="276" font-size="10.5" fill="#1d2330" text-anchor="middle">unit 1</text>
    <text x="592" y="276" font-size="10.5" fill="#1d2330" text-anchor="middle">unit 1</text>
    <rect x="366" y="250" width="282" height="8" fill="#2f6f4f"/>
    <text x="372" y="246" font-size="10.5" font-weight="700" fill="#2f6f4f">CGL</text>
    <rect x="366" y="198" width="282" height="30" fill="#b9cdea" opacity="0.9"/>
    <text x="432" y="217" font-size="10.5" fill="#1d2330" text-anchor="middle">unit 2</text>
    <rect x="352" y="186" width="310" height="12" fill="#c9a227"/>
    <text x="507" y="195.5" font-size="10" fill="#1d2330" text-anchor="middle">common cathode</text>
    <path d="M452 254 L500 254 L507 262" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ah)"/>
    <text x="352" y="364" font-size="11.5" fill="#1d2330">The CGL stays continuous but is held at a set</text>
    <text x="352" y="380" font-size="11.5" fill="#1d2330">potential, so stray charge drains before pixel 2.</text>
  </g>
</svg>
