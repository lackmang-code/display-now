<svg viewBox="0 0 840 452" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Serif KR', serif">
  <rect x="0.5" y="0.5" width="839" height="451" fill="#fdfdfc" stroke="#dcdcd6" stroke-width="1"/>

  <text x="28" y="40" font-size="21" font-weight="700" fill="#12120e" letter-spacing="-0.3">One scan or two</text>
  <text x="28" y="60" font-size="12.5" fill="#8a8a80" font-family="'IBM Plex Mono', monospace" letter-spacing="0.5">4K 2,160 lines · time budget per gate line · DESK</text>

  <line x1="28" y1="78" x2="812" y2="78" stroke="#e4e4de" stroke-width="1"/>

  <!-- ================= LEFT : single scan ================= -->
  <text x="30" y="104" font-size="12" font-weight="600" fill="#8a3a26" font-family="'IBM Plex Mono', monospace" letter-spacing="1">SINGLE REGION &#183; 165 Hz</text>

  <!-- panel -->
  <rect x="30" y="118" width="150" height="188" fill="#fdf3f0" stroke="#c2705a" stroke-width="1.4"/>
  <text x="105" y="142" font-size="11" fill="#8a3a26" text-anchor="middle" font-family="'IBM Plex Mono', monospace">line 1</text>
  <line x1="46" y1="152" x2="164" y2="152" stroke="#d99a86" stroke-width="1"/>
  <line x1="46" y1="168" x2="164" y2="168" stroke="#d99a86" stroke-width="1"/>
  <line x1="46" y1="184" x2="164" y2="184" stroke="#d99a86" stroke-width="1"/>
  <line x1="46" y1="200" x2="164" y2="200" stroke="#d99a86" stroke-width="1"/>
  <line x1="46" y1="216" x2="164" y2="216" stroke="#d99a86" stroke-width="1"/>
  <line x1="46" y1="232" x2="164" y2="232" stroke="#d99a86" stroke-width="1"/>
  <line x1="46" y1="248" x2="164" y2="248" stroke="#d99a86" stroke-width="1"/>
  <line x1="46" y1="264" x2="164" y2="264" stroke="#d99a86" stroke-width="1"/>
  <text x="105" y="292" font-size="11" fill="#8a3a26" text-anchor="middle" font-family="'IBM Plex Mono', monospace">line 2,160</text>

  <!-- arrow: one sweep -->
  <line x1="196" y1="126" x2="196" y2="292" stroke="#c2705a" stroke-width="2"/>
  <path d="M 192 286 L 196 298 L 200 286 Z" fill="#c2705a"/>
  <text x="208" y="205" font-size="11.5" fill="#8a3a26" font-family="'IBM Plex Sans KR', sans-serif">2,160 lines</text>
  <text x="208" y="220" font-size="11.5" fill="#8a3a26" font-family="'IBM Plex Sans KR', sans-serif">in one sweep</text>

  <rect x="30" y="322" width="266" height="52" rx="4" fill="#fbeeea" stroke="#e8cbc3" stroke-width="1"/>
  <text x="46" y="343" font-size="12.5" font-weight="600" fill="#8a3a26" font-family="'IBM Plex Mono', monospace">2.806 µs per line</text>
  <text x="46" y="362" font-size="11.5" fill="#7a4a3a" font-family="'IBM Plex Sans KR', sans-serif">12.7% tighter than 144 Hz. Bezel must grow.</text>

  <!-- divider -->
  <line x1="420" y1="96" x2="420" y2="396" stroke="#e4e4de" stroke-width="1"/>

  <!-- ================= RIGHT : two regions ================= -->
  <text x="444" y="104" font-size="12" font-weight="600" fill="#5c3a7a" font-family="'IBM Plex Mono', monospace" letter-spacing="1">TWO REGIONS &#183; 165 Hz</text>

  <rect x="444" y="118" width="150" height="90" fill="#f2ecf7" stroke="#8f6bb0" stroke-width="1.4"/>
  <text x="519" y="140" font-size="11" fill="#4a2d63" text-anchor="middle" font-family="'IBM Plex Mono', monospace">line 1</text>
  <line x1="460" y1="150" x2="578" y2="150" stroke="#b9a3cc" stroke-width="1"/>
  <line x1="460" y1="166" x2="578" y2="166" stroke="#b9a3cc" stroke-width="1"/>
  <line x1="460" y1="182" x2="578" y2="182" stroke="#b9a3cc" stroke-width="1"/>
  <text x="519" y="200" font-size="11" fill="#4a2d63" text-anchor="middle" font-family="'IBM Plex Mono', monospace">line 1,080</text>

  <rect x="444" y="216" width="150" height="90" fill="#f2ecf7" stroke="#8f6bb0" stroke-width="1.4"/>
  <text x="519" y="238" font-size="11" fill="#4a2d63" text-anchor="middle" font-family="'IBM Plex Mono', monospace">line 1,081</text>
  <line x1="460" y1="248" x2="578" y2="248" stroke="#b9a3cc" stroke-width="1"/>
  <line x1="460" y1="264" x2="578" y2="264" stroke="#b9a3cc" stroke-width="1"/>
  <line x1="460" y1="280" x2="578" y2="280" stroke="#b9a3cc" stroke-width="1"/>
  <text x="519" y="298" font-size="11" fill="#4a2d63" text-anchor="middle" font-family="'IBM Plex Mono', monospace">line 2,160</text>

  <!-- two arrows, side by side -->
  <line x1="610" y1="126" x2="610" y2="196" stroke="#8f6bb0" stroke-width="2"/>
  <path d="M 606 190 L 610 202 L 614 190 Z" fill="#8f6bb0"/>
  <line x1="610" y1="224" x2="610" y2="294" stroke="#8f6bb0" stroke-width="2"/>
  <path d="M 606 288 L 610 300 L 614 288 Z" fill="#8f6bb0"/>
  <text x="624" y="205" font-size="11.5" fill="#4a2d63" font-family="'IBM Plex Sans KR', sans-serif">1,080 lines each,</text>
  <text x="624" y="220" font-size="11.5" fill="#4a2d63" font-family="'IBM Plex Sans KR', sans-serif">at the same time</text>

  <rect x="444" y="322" width="368" height="52" rx="4" fill="#f2ecf7" stroke="#cbb8da" stroke-width="1"/>
  <text x="460" y="343" font-size="12.5" font-weight="600" fill="#4a2d63" font-family="'IBM Plex Mono', monospace">5.612 µs per line</text>
  <text x="460" y="362" font-size="11.5" fill="#5c4470" font-family="'IBM Plex Sans KR', sans-serif">74.5% more room than 144 Hz. Bezel can shrink.</text>

  <!-- ================= bottom : the price ================= -->
  <text x="30" y="404" font-size="12.5" fill="#4a4a44" font-family="'IBM Plex Sans KR', sans-serif">The gate side gets easier. The source side pays for it.</text>
  <text x="30" y="424" font-size="11.5" fill="#8a8a80" font-family="'IBM Plex Sans KR', sans-serif">Two regions must be fed at once: 82.1 Gbps of pixel data, 2.29× the 144 Hz single-region load. More switching, more heat.</text>
  <text x="30" y="443" font-size="10.5" fill="#a0a098" font-family="'IBM Plex Mono', monospace">Blanking excluded. 4K RGB 10-bit. Inferred by DESK from published figures; LG Display has not disclosed the driving structure.</text>
</svg>
