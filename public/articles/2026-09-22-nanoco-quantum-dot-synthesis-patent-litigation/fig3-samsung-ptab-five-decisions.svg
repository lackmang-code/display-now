<text x="610" y="90" font-size="12" font-weight="700" fill="#1d1d1b" text-anchor="middle">Quantum dot</text>
<text x="610" y="104" font-size="12" font-weight="700" fill="#1d1d1b" text-anchor="middle">phosphor film</text>
<text x="610" y="118" font-size="12" font-weight="400" fill="#6b6b66" text-anchor="middle">(Dubrow)</text>
