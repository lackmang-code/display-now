<svg viewBox="0 0 840 420" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans KR', sans-serif">
  <rect x="0.5" y="0.5" width="839" height="419" fill="#fdfdfc" stroke="#dcdcd6" stroke-width="1"/>

  <text x="28" y="40" font-size="21" font-weight="700" fill="#12120e" letter-spacing="-0.3" font-family="'Noto Serif KR', serif">Two announcements, one node</text>
  <text x="28" y="60" font-size="12.5" fill="#8a8a80" font-family="'IBM Plex Mono', monospace" letter-spacing="0.5">Display driver IC · August to September 2026 · DESK</text>
  <line x1="28" y1="78" x2="812" y2="78" stroke="#e4e4de" stroke-width="1"/>

  <!-- timeline -->
  <line x1="60" y1="150" x2="790" y2="150" stroke="#c9c9c3" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="5" fill="#c2705a"/>
  <circle cx="450" cy="150" r="5" fill="#5c3a7a"/>
  <circle cx="700" cy="150" r="5" fill="#c2705a"/>

  <text x="150" y="132" font-size="11.5" font-weight="600" fill="#6a6a62" text-anchor="middle" font-family="'IBM Plex Mono', monospace">Aug 28</text>
  <text x="450" y="132" font-size="11.5" font-weight="600" fill="#6a6a62" text-anchor="middle" font-family="'IBM Plex Mono', monospace">Sep 14</text>
  <text x="700" y="132" font-size="11.5" font-weight="600" fill="#6a6a62" text-anchor="middle" font-family="'IBM Plex Mono', monospace">Sep 18</text>

  <!-- supply side (below) -->
  <rect x="40" y="176" width="230" height="86" rx="5" fill="#fbeeea" stroke="#c2705a" stroke-width="1.4"/>
  <text x="56" y="199" font-size="12.5" font-weight="600" fill="#8a3a26">Fold8 driver ICs run tight</text>
  <text x="56" y="219" font-size="11.5" fill="#7a4a3a">designed by Samsung System LSI,</text>
  <text x="56" y="235" font-size="11.5" fill="#7a4a3a">built by UMC on 22 nm</text>
  <text x="56" y="253" font-size="10.5" fill="#7a4a3a">next year's stock pulled into production</text>

  <rect x="580" y="176" width="230" height="86" rx="5" fill="#fbeeea" stroke="#c2705a" stroke-width="1.4"/>
  <text x="596" y="199" font-size="12.5" font-weight="600" fill="#8a3a26">10 % of the September build</text>
  <text x="596" y="216" font-size="12.5" font-weight="600" fill="#8a3a26">pushed to October</text>
  <text x="596" y="236" font-size="11.5" fill="#7a4a3a">tens of thousands of units</text>
  <text x="596" y="253" font-size="11.5" fill="#7a4a3a">rush production request declined</text>

  <!-- panel side (above) -->
  <rect x="330" y="88" width="250" height="34" rx="5" fill="#f2ecf7" stroke="#b9a3cc" stroke-width="1.4" opacity="0"/>
  <rect x="325" y="176" width="230" height="86" rx="5" fill="#f2ecf7" stroke="#b9a3cc" stroke-width="1.4"/>
  <text x="341" y="199" font-size="12.5" font-weight="600" fill="#4a2d63">New mobile panel announced</text>
  <text x="341" y="219" font-size="11.5" fill="#5e4478">driver IC moved from 28 nm to 22 nm</text>
  <text x="341" y="235" font-size="11.5" fill="#5e4478">chip operating power down about 30 %</text>
  <text x="341" y="253" font-size="11.5" fill="#5e4478">2K at 165 Hz</text>

  <line x1="150" y1="155" x2="150" y2="176" stroke="#c2705a" stroke-width="1.2"/>
  <line x1="450" y1="155" x2="450" y2="176" stroke="#b9a3cc" stroke-width="1.2"/>
  <line x1="700" y1="155" x2="700" y2="176" stroke="#c2705a" stroke-width="1.2"/>

  <!-- node bar -->
  <rect x="40" y="290" width="770" height="44" rx="5" fill="#f6f6f4" stroke="#d5d5cf" stroke-width="1.4"/>
  <text x="56" y="308" font-size="12.5" font-weight="600" fill="#4a4a44">The same node generation: 22 nm, a mature node</text>
  <text x="56" y="326" font-size="11.5" fill="#6a6a62">Whether the two chips run on the same line is not disclosed. The panel maker did not name its foundry.</text>

  <text x="40" y="364" font-size="12.5" fill="#4a4a44">A driver IC is a custom chip for one panel, so a shortage cannot be covered by buying from the market.</text>
  <text x="40" y="384" font-size="12" fill="#6a6a62">Reported lead time from a normal production run to a finished set: about four months.</text>
  <text x="40" y="406" font-size="10.5" fill="#a0a098" font-family="'IBM Plex Mono', monospace">Drawn by DESK from ZDNet Korea (2026-08-28, 2026-09-18), DIGITIMES (2026-08-31) and Samsung Display (2026-09-14).</text>
</svg>
