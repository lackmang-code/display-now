<text x="52" y="420" font-size="13.5" fill="#b8862a" font-weight="700" font-family="'IBM Plex Mono', monospace">뒤집힌 것은 방향이다</text>
<text x="52" y="450" font-size="13" fill="#4d4d45">처리한 소자의 피크 외부양자효율은</text>
<text x="52" y="472" font-size="13" fill="#4d4d45">칩이 작아질수록 오히려 올라간다.</text>
<text x="52" y="498" font-size="12.5" fill="#7a7a72">측벽 재결합이 사라지면 작아질수록 유리한 광추출만 남는다.</text>
<text x="624" y="438" font-size="15" fill="#7a7a72" font-family="'IBM Plex Mono', monospace">100μm    38.9%</text>
<text x="624" y="478" font-size="19" fill="#b8862a" font-weight="700" font-family="'IBM Plex Mono', monospace">1.6μm    47.6%</text>
<text x="28" y="538" font-size="12" fill="#8a8a80">각 행은 그 항목의 눈금(오른쪽 끝 표기)에 맞춰 그렸다. 항목마다 단위가 달라 행 사이의 길이를 서로 견주지는 않는다.</text>
