  <text x="28" y="441" font-size="11.5" fill="#6f6f66">막대는 우선일부터 만료일까지. 점선 막대는 아직 등록되지 않은 출원으로, 만료일은 우선일에 20년을 더한 값이다.</text>
  <text x="28" y="457" font-size="11.5" fill="#6f6f66">청색 인광의 원리를 청구한 특허는 2020년 8월 존속기간이 끝났고, 6년이 지난 지금도 양산 채택은 공표되지 않았다.</text>
