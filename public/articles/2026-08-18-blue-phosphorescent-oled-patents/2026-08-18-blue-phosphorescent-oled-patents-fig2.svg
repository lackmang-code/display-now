  <line x1="568.7" y1="184" x2="568.7" y2="192" stroke="#236436" stroke-width="1"/>
  <line x1="635.8" y1="184" x2="635.8" y2="192" stroke="#236436" stroke-width="1"/>
  <text x="602" y="203" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#236436" text-anchor="middle">만료 후 6년</text>

