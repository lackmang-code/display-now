  <line x1="635.8" y1="92" x2="635.8" y2="396" stroke="#12120e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="566" y="70" width="140" height="19" fill="#12120e"/>
  <text x="636" y="84" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#f4f3ee" text-anchor="middle" letter-spacing="0.3">2026.08 현재 · 미양산</text>

  <!-- row 1 : US6303238B1 -->
  <text x="240" y="115" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#12120e" text-anchor="end">US6303238B1</text>
