  <text x="28" y="63" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#8a8a80" letter-spacing="0.4">청색 인광 관련 특허의 존속기간 · 구글특허 서지사항(우선일·만료일) 기준</text>

