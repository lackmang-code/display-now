  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#8a8a80" text-anchor="middle">
    <line x1="312.2" y1="396" x2="312.2" y2="401" stroke="#c9c9c4"/><text x="312.2" y="414">2000</text>
