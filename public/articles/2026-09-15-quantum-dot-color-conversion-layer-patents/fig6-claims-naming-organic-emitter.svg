<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" width="650" height="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="650" height="300" fill="#ffffff"/>
  <text x="24" y="30" font-size="14" font-weight="700" fill="#1d1d1b">How often every independent claim names an organic light emitter</text>
  <text x="24" y="50" font-size="12" fill="#6b6b66">Structure and process patents. Others leave the light source out of some independent claim.</text>

  <!-- 축: 0~40% = 160~560 (10px/%) -->
  <g stroke="#e3e3dc">
    <line x1="160" y1="66" x2="160" y2="262"/><line x1="260" y1="66" x2="260" y2="262"/>
    <line x1="360" y1="66" x2="360" y2="262"/><line x1="460" y1="66" x2="460" y2="262"/><line x1="560" y1="66" x2="560" y2="262"/>
  </g>
  <g font-size="11.5" fill="#8a8a80" text-anchor="middle">
    <text x="160" y="280">0%</text><text x="260" y="280">10%</text><text x="360" y="280">20%</text><text x="460" y="280">30%</text><text x="560" y="280">40%</text>
  </g>

  <g font-size="13" fill="#1d1d1b">
    <text x="24" y="92" font-weight="600">Samsung Display</text>
    <rect x="160" y="76" width="31.9" height="24" fill="#2f62c9"/>
    <text x="200" y="93" fill="#1d1d1b">3%  (6 of 188)</text>

    <text x="24" y="130" font-weight="600">Samsung Electronics</text>
    <rect x="160" y="114" width="181.8" height="24" fill="#8fa9dc"/>
    <text x="350" y="131">18%  (4 of 22)</text>

    <text x="24" y="168" font-weight="600">BOE</text>
    <rect x="160" y="152" width="166.7" height="24" fill="#8fa9dc"/>
    <text x="335" y="169">17%  (4 of 24)</text>

    <text x="24" y="206" font-weight="600">LG Display</text>
    <rect x="160" y="190" width="181.8" height="24" fill="#8fa9dc"/>
    <text x="350" y="207">18%  (2 of 11)</text>

    <text x="24" y="244" font-weight="600">CSOT group</text>
    <rect x="160" y="228" width="368.4" height="24" fill="#8fa9dc"/>
    <text x="537" y="245">37%  (7 of 19)</text>
  </g>
</svg>
