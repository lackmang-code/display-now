<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" width="740" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f62c9"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f8a4f"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0751f"/></marker>
    <pattern id="scat" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#9aa3b5"/><circle cx="8" cy="7" r="1.1" fill="#9aa3b5"/></pattern>
  </defs>
  <rect width="740" height="470" fill="#ffffff"/>

  <!-- 층 -->
  <rect x="60" y="96" width="560" height="22" fill="#eef1f5" stroke="#b9c0cc"/>
  <text x="626" y="111" font-size="12" fill="#55606e">Cover glass</text>

  <rect x="92" y="118" width="148" height="20" fill="#e9a79c"/>
  <rect x="264" y="118" width="148" height="20" fill="#9fd1ad"/>
  <rect x="436" y="118" width="148" height="20" fill="#f4f5f7" stroke="#c9ced6"/>
  <text x="626" y="132" font-size="12" fill="#55606e">Color filter</text>

  <rect x="92" y="138" width="148" height="62" fill="#f6d2cb"/>
  <rect x="264" y="138" width="148" height="62" fill="#d3ecd9"/>
  <rect x="436" y="138" width="148" height="62" fill="url(#scat)" stroke="#c9ced6"/>
  <text x="166" y="175" font-size="12" fill="#8e3a2c" text-anchor="middle">Red quantum dots</text>
  <text x="338" y="175" font-size="12" fill="#2a6b3e" text-anchor="middle">Green quantum dots</text>
  <text x="510" y="175" font-size="12" fill="#55606e" text-anchor="middle">Clear + scatterers</text>

  <g fill="#3a3a3a">
    <rect x="68" y="118" width="24" height="82"/><rect x="240" y="118" width="24" height="82"/>
    <rect x="412" y="118" width="24" height="82"/><rect x="584" y="118" width="24" height="82"/>
  </g>
  <text x="626" y="172" font-size="12" fill="#55606e">Bank with</text>
  <text x="626" y="186" font-size="12" fill="#55606e">light blocker</text>

  <rect x="60" y="200" width="560" height="44" fill="#fafaf7" stroke="#d9d9d2" stroke-dasharray="4 3"/>
  <text x="626" y="226" font-size="12" fill="#55606e">Gap</text>

  <rect x="60" y="244" width="560" height="16" fill="#e6e8ec"/>
  <text x="626" y="256" font-size="12" fill="#55606e">Encapsulation</text>

  <g fill="#4b7be0"><rect x="100" y="262" width="132" height="14"/><rect x="272" y="262" width="132" height="14"/><rect x="444" y="262" width="132" height="14"/></g>
  <rect x="60" y="276" width="560" height="26" fill="#d9dce2"/>
  <text x="626" y="274" font-size="12" fill="#2f62c9">Blue OLED</text>
  <text x="626" y="293" font-size="12" fill="#55606e">Backplane</text>

  <!-- 1 앞으로: 못 바꾼 청색 -->
  <line x1="150" y1="262" x2="150" y2="132" stroke="#2f62c9" stroke-width="2.4" marker-end="url(#aB)"/>
  <path d="M142,121 L158,137 M158,121 L142,137" stroke="#c0392b" stroke-width="2.6"/>
  <line x1="190" y1="262" x2="190" y2="160" stroke="#2f62c9" stroke-width="1.6" stroke-dasharray="3 3"/>
  <line x1="190" y1="160" x2="190" y2="88" stroke="#c9503d" stroke-width="2.4" marker-end="url(#aB)"/>

  <!-- 2 옆·뒤로: 바꾼 빛은 방향이 없다 -->
  <circle cx="338" cy="152" r="4.5" fill="#2f8a4f"/>
  <line x1="338" y1="152" x2="338" y2="88" stroke="#2f8a4f" stroke-width="2.2" marker-end="url(#aG)"/>
  <line x1="338" y1="152" x2="272" y2="146" stroke="#2f8a4f" stroke-width="2.2" marker-end="url(#aG)"/>
  <line x1="338" y1="152" x2="376" y2="232" stroke="#2f8a4f" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#aG)"/>

  <!-- 거리: 비스듬히 나간 청색이 옆 화소에 닿는다 -->
  <line x1="360" y1="262" x2="206" y2="202" stroke="#2f62c9" stroke-width="1.8" stroke-dasharray="6 3" marker-end="url(#aB)"/>

  <!-- 3 밖에서: 외광 -->
  <line x1="560" y1="20" x2="488" y2="152" stroke="#b0751f" stroke-width="2.2" marker-end="url(#aA)"/>
  <line x1="488" y1="152" x2="430" y2="30" stroke="#b0751f" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#aA)"/>

  <!-- 번호 -->
  <g font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="116" cy="70" r="11" fill="#1d1d1b"/><text x="116" y="75">1</text>
    <circle cx="300" cy="70" r="11" fill="#1d1d1b"/><text x="300" y="75">2</text>
    <circle cx="398" cy="226" r="11" fill="#1d1d1b"/><text x="398" y="231">2</text>
    <circle cx="590" cy="44" r="11" fill="#1d1d1b"/><text x="590" y="49">3</text>
  </g>

  <!-- 설명 -->
  <g font-size="13" fill="#1d1d1b">
    <circle cx="72" cy="340" r="10" fill="#1d1d1b"/><text x="72" y="345" fill="#fff" font-weight="700" text-anchor="middle">1</text>
    <text x="92" y="338" font-weight="700">Forward</text>
    <text x="92" y="356" fill="#444">A thin layer does not absorb all the blue. What gets through is</text>
    <text x="92" y="372" fill="#444">stopped by the color filter above, or it mixes into the red.</text>

    <circle cx="72" cy="398" r="10" fill="#1d1d1b"/><text x="72" y="403" fill="#fff" font-weight="700" text-anchor="middle">2</text>
    <text x="92" y="396" font-weight="700">Sideways and back</text>
    <text x="92" y="414" fill="#444">Re-emitted light has no preferred direction. Banks catch the side-going</text>
    <text x="92" y="430" fill="#444">part; a wider gap lets slanted blue land in the neighbor before conversion.</text>

    <circle cx="72" cy="454" r="10" fill="#1d1d1b"/><text x="72" y="459" fill="#fff" font-weight="700" text-anchor="middle">3</text>
    <text x="92" y="459" font-weight="700">From outside</text>
    <text x="210" y="459" fill="#444">Room light enters, excites the dots and bounces off scatterers.</text>
  </g>
</svg>
