<text x="32" y="46" font-size="27" font-weight="700" fill="#151a22" letter-spacing="-0.3">The head impact test a car display must pass</text>
<text x="32" y="76" font-size="17" fill="#5b6474">FMVSS 201 S5.1: a 6.8 kg, 165 mm headform hits the instrument panel</text>
