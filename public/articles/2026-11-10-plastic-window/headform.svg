<text x="560.0" y="150.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700" >S5.1(b)</text>
<text x="636.0" y="150.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="500" >19 km/h with airbags</text>
<text x="560.0" y="178.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700" >Both</text>
<text x="636.0" y="178.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="500" >not above 80 g for over 3 ms</text>
<text x="44.0" y="458.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >Corning US11078111B2 tests glass covers with a 6.8 kg impactor at 5.35–6.69 m/s.</text>
