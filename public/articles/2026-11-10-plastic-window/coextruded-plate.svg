<text x="356.0" y="208.0" font-size="15" fill="#0d9488" text-anchor="start" font-weight="700" >acrylic 60–150 μm</text>
<text x="356.0" y="306.0" font-size="15" fill="#d97706" text-anchor="start" font-weight="700" >PC base</text>
