<text x="526.0" y="326.0" font-size="17" fill="#151a22" text-anchor="start" font-weight="700" >Warp</text>
<text x="526.0" y="348.0" font-size="15" fill="#151a22" text-anchor="start" font-weight="500" >≤ 1,000 μm after 85 °C, 85% RH, 120 h</text>
<text x="526.0" y="368.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >US10710291B2</text>
<text x="526.0" y="388.0" font-size="17" fill="#151a22" text-anchor="start" font-weight="700" >Tg gap</text>
<text x="526.0" y="410.0" font-size="15" fill="#151a22" text-anchor="start" font-weight="500" >skin minus PC between −10 and +40 °C</text>
<text x="526.0" y="430.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >US11370206B2</text>
<text x="526.0" y="450.0" font-size="17" fill="#151a22" text-anchor="start" font-weight="700" >Skin resin</text>
<text x="526.0" y="472.0" font-size="15" fill="#151a22" text-anchor="start" font-weight="500" >acrylate 65–80 mol%, aliphatic vinyl ≥20 mol%</text>
<text x="526.0" y="492.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >US11370206B2</text>
<text x="526.0" y="512.0" font-size="17" fill="#151a22" text-anchor="start" font-weight="700" >Gas</text>
<text x="526.0" y="534.0" font-size="15" fill="#151a22" text-anchor="start" font-weight="500" >CO₂ ≤ 500 nL/cm³, no bubbles at the bond</text>
<text x="526.0" y="554.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >Sumitomo JP2011201183A</text>
