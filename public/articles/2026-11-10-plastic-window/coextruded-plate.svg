<text x="46.0" y="450.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >Layers drawn thicker than scale.</text>
<text x="46.0" y="478.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="600" >Example 1: 1.2 mm in total, 60 μm acrylic skin.</text>
<text x="46.0" y="504.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="600" >Laminate pencil hardness 2H to 3H with the</text>
<text x="46.0" y="528.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="600" >skin, against “2B” for bare PC.</text>
