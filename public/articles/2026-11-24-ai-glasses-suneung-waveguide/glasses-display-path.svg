<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="t d"><title id="t">Two ways AI glasses present information</title><desc id="d">Top: glasses without a display answer by voice. Bottom: glasses with a projector at the temple, a transparent light guide with partial mirrors, and the eye. The projector makes parallel light that travels by internal reflection and is coupled out toward the eye.</desc><rect width="760" height="520" fill="#fbfaf7"/>
<text x="20" y="34" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1a1a17">A. No display: information comes by voice</text>
<rect x="40" y="56" width="170" height="64" rx="6" fill="#e7dcee" stroke="#6b3a8c" stroke-width="3"/>
<text x="125" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#6b3a8c">Camera, mic</text>
<text x="125" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#1a1a17">capture</text>
<line x1="212" y1="88" x2="290" y2="88" stroke="#1a1a17" stroke-width="3"/><polygon points="292,88 276,80 276,96" fill="#1a1a17"/>
<rect x="294" y="56" width="170" height="64" rx="6" fill="#fbfaf7" stroke="#55554f" stroke-width="3"/>
<text x="379" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1a1a17">Phone / cloud AI</text>
<text x="379" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#1a1a17">answer</text>
<line x1="466" y1="88" x2="544" y2="88" stroke="#1a1a17" stroke-width="3"/><polygon points="546,88 530,80 530,96" fill="#1a1a17"/>
<rect x="548" y="56" width="172" height="64" rx="6" fill="#e7dcee" stroke="#6b3a8c" stroke-width="3"/>
<text x="634" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#6b3a8c">Speaker</text>
<text x="634" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#1a1a17">sound only</text>
<line x1="20" y1="150" x2="740" y2="150" stroke="#d8d6cf" stroke-width="2"/>
<text x="20" y="184" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="bold" fill="#1a1a17">B. Reflective waveguide: text appears in the lens</text>
<rect x="120" y="270" width="520" height="60" fill="#d8d6cf" stroke="#55554f" stroke-width="3"/>
<text x="130" y="356" text-anchor="start" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#55554f">Transparent light guide (lens)</text>
<rect x="30" y="256" width="86" height="88" rx="6" fill="#6b3a8c" stroke="#1a1a17" stroke-width="2"/>
<text x="73" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff">Micro-</text>
<text x="73" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff">display</text>
<text x="73" y="372" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#6b3a8c">parallel light</text>
<polyline points="122,290 210,272 298,328 386,272 474,328 562,272" fill="none" stroke="#6b3a8c" stroke-width="3"/>
<text x="210" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#6b3a8c">internal reflection</text>
<line x1="440" y1="272" x2="470" y2="328" stroke="#1a1a17" stroke-width="4"/>
<line x1="520" y1="272" x2="550" y2="328" stroke="#1a1a17" stroke-width="4"/>
<line x1="600" y1="272" x2="630" y2="328" stroke="#1a1a17" stroke-width="4"/>
<text x="540" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#1a1a17">partial mirrors</text>
<line x1="470" y1="330" x2="478" y2="400" stroke="#6b3a8c" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="550" y1="330" x2="558" y2="400" stroke="#6b3a8c" stroke-width="3" stroke-dasharray="4 4"/>
<line x1="630" y1="330" x2="638" y2="400" stroke="#6b3a8c" stroke-width="3" stroke-dasharray="4 4"/>
<ellipse cx="640" cy="440" rx="42" ry="24" fill="#fbfaf7" stroke="#1a1a17" stroke-width="3"/><circle cx="640" cy="440" r="10" fill="#1a1a17"/>
<text x="640" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1a1a17">eye</text>
<text x="20" y="508" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#55554f">Schematic after Lumus patent US 12,352,974 B2, claim 1. Not to scale.</text>
</svg>