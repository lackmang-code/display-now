<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 478" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<rect width="680" height="478" fill="#ffffff"/>
<text x="20.0" y="26.0" font-size="15" fill="#1d2330" font-weight="700" text-anchor="start">How each route protects the organic layer during patterning</text>
<text x="20.0" y="44.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">One key moment per route, first colour (red) on pixel A. Same base: three anodes, PDL over their edges.</text>
<text x="20.0" y="84.0" font-size="14" fill="#c2410c" font-weight="700" text-anchor="start">1  Lift-off</text>
<text x="20.0" y="106.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">A mould with an undercut</text>
<text x="20.0" y="122.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">covers B and C. Red lands</text>
<text x="20.0" y="138.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">on A and on the mould; the</text>
<text x="20.0" y="154.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">mould is lifted off in solvent.</text>
