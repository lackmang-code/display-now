<text x="644.0" y="76.0" font-size="10" fill="#5b6474" font-weight="400" text-anchor="end">lifted away</text>
<text x="20.0" y="216.0" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="start">2  Permanent overhang</text>
<text x="20.0" y="238.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">Overhangs stand on the PDL</text>
<text x="20.0" y="254.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">and cut the layer. Red,</text>
<text x="20.0" y="270.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">cathode and seal cover all;</text>
<text x="20.0" y="286.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">resist on A, the rest is etched.</text>
