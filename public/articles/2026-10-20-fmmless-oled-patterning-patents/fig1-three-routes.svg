<text x="450.0" y="258.0" font-size="10" fill="#d6455d" font-weight="400" text-anchor="middle">etched away</text>
<text x="580.0" y="258.0" font-size="10" fill="#d6455d" font-weight="400" text-anchor="middle">etched away</text>
<text x="20.0" y="348.0" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="start">3  Deposit, then etch</text>
<text x="20.0" y="370.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">Red is laid over the whole</text>
<text x="20.0" y="386.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">panel. A hard mask on A</text>
<text x="20.0" y="402.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">protects it; the rest is</text>
<text x="20.0" y="418.0" font-size="11" fill="#5b6474" font-weight="400" text-anchor="start">etched directly.</text>
