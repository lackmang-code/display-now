<text x="38" y="372" font-size="13.5" font-weight="700" fill="#4a2d63">FMM cuts the glass because the mask sags. the cut also divided the glass sag by about 9.</text>
<text x="38" y="391" font-size="13" fill="#5e4478">Drop the mask and keep the glass whole: you carry about 9 times the sag. Gen 8.6 carries 17.4% more than Gen 8.5.</text>
<text x="22" y="430" font-size="12" fill="#a0a098" font-family="'IBM Plex Mono', monospace">DESK &#183; exponents from beam theory, consistent with US 7,888,276</text>
