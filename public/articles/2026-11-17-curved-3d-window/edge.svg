<rect x="0.5" y="0.5" width="899" height="519" fill="#ffffff" stroke="#d9dde3"/>
<text x="32" y="46" font-size="27" font-weight="700" fill="#151a22" letter-spacing="-0.3">Three edges, three meanings of 2D, 2.5D and 3D</text>
<text x="32" y="76" font-size="17" fill="#5b6474">Definitions as written in Corning US11370698B2. There is no standard for these terms.</text>
<rect x="24" y="98" width="480" height="402" rx="10" fill="#f7f9fb" stroke="#d9dde3"/>
<text x="44.0" y="166.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700" >2D</text>
<text x="44.0" y="190.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >chamfered edge</text>
<path d="M190.0,175.0 L199.0,184.0 L480.0,184.0 L480.0,150.0 L199.0,150.0 L190.0,159.0 Z" fill="url(#gFront)" stroke="#4d7f97" stroke-width="1.5" stroke-linejoin="round" />
<text x="44.0" y="278.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700" >2.5D</text>
<text x="44.0" y="302.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >front edge curved</text>
<path d="M190.0,296.0 L190.0,296.0 L190.1,294.0 L190.5,292.0 L191.2,290.0 L192.0,288.0 L193.2,286.0 L194.6,284.1 L196.2,282.3 L198.0,280.5 L200.1,278.8 L202.4,277.1 L204.9,275.6 L207.6,274.1 L210.4,272.7 L213.5,271.4 L216.7,270.2 L220.0,269.2 L223.5,268.2 L227.0,267.4 L230.7,266.6 L234.5,266.1 L238.3,265.6 L242.2,265.3 L246.1,265.1 L250.0,265.0 L480.0,262.0 L480.0,296.0 Z" fill="url(#gFront)" stroke="#4d7f97" stroke-width="1.5" stroke-linejoin="round" />
<text x="44.0" y="394.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700" >3D</text>
<text x="44.0" y="418.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >edge bent down</text>
<path d="M190.0,436.0 L190.0,414.0 L190.1,410.5 L190.5,407.1 L191.2,403.7 L192.2,400.4 L193.3,397.2 L194.8,394.0 L196.5,391.0 L198.4,388.1 L200.5,385.4 L202.9,382.9 L205.4,380.5 L208.1,378.4 L211.0,376.5 L214.0,374.8 L217.2,373.3 L220.4,372.2 L223.7,371.2 L227.1,370.5 L230.5,370.1 L234.0,370.0 L480.0,370.0 L480.0,394.0 L234.0,394.0 L232.4,394.1 L230.9,394.2 L229.3,394.6 L227.8,395.0 L226.3,395.5 L224.9,396.2 L223.6,396.9 L222.2,397.8 L221.0,398.8 L219.9,399.9 L218.8,401.0 L217.8,402.2 L216.9,403.6 L216.2,404.9 L215.5,406.3 L215.0,407.8 L214.6,409.3 L214.2,410.9 L214.1,412.4 L214.0,414.0 L214.0,436.0 Z" fill="url(#gFront)" stroke="#4d7f97" stroke-width="1.5" stroke-linejoin="round" />
<text x="44.0" y="478.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >Grinding makes 2D and 2.5D. Only 3D needs the glass to soften.</text>
<rect x="516" y="98" width="360" height="402" rx="10" fill="#f7f9fb" stroke="#d9dde3"/>
<text x="536.0" y="132.0" font-size="20" fill="#151a22" text-anchor="start" font-weight="700" >Surface compression lost</text>
<text x="536.0" y="156.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >at the edge after strengthening</text>
<text x="536.0" y="192.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="600" >Square edge</text>
<rect x="536.0" y="202.0" width="276.0" height="24.0" fill="#e6e9ee" rx="4"/>
<rect x="536.0" y="202.0" width="242.9" height="24.0" fill="#e5482a" rx="4"/>
<text x="786.9" y="220.0" font-size="17" fill="#e5482a" text-anchor="start" font-weight="700" >22%</text>
<text x="536.0" y="268.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="600" >0.15 mm chamfer</text>
<rect x="536.0" y="278.0" width="276.0" height="24.0" fill="#e6e9ee" rx="4"/>
<rect x="536.0" y="278.0" width="176.6" height="24.0" fill="#ea580c" rx="4"/>
<text x="720.6" y="296.0" font-size="17" fill="#ea580c" text-anchor="start" font-weight="700" >16%</text>
<text x="536.0" y="344.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="600" >Rounded edge</text>
<rect x="536.0" y="354.0" width="276.0" height="24.0" fill="#e6e9ee" rx="4"/>
<rect x="536.0" y="354.0" width="44.2" height="24.0" fill="#15955a" rx="4"/>
<text x="588.2" y="372.0" font-size="17" fill="#15955a" text-anchor="start" font-weight="700" >4%</text>
<text x="536.0" y="432.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >Apple EP2404228B1, FIG. 12. Rounded:</text>
<text x="536.0" y="454.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >radius about 25% of thickness.</text>
<text x="536.0" y="476.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >Edge profile, not a 3D bend.</text>
</svg>