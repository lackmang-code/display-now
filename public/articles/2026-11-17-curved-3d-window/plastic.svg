<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans KR', Inter, system-ui, sans-serif">
<defs>
<linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4fbfe"/><stop offset="1" stop-color="#cfe7f2"/></linearGradient>
<linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cde8f3"/><stop offset="1" stop-color="#a9d2e4"/></linearGradient>
<linearGradient id="gSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#86b6cc"/><stop offset="1" stop-color="#5f93ab"/></linearGradient>
<linearGradient id="gComp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f86f7"/><stop offset="1" stop-color="#2459d6"/></linearGradient>
<linearGradient id="gTens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7b3a3"/><stop offset="0.5" stop-color="#fbd3c8"/><stop offset="1" stop-color="#f7b3a3"/></linearGradient>
<linearGradient id="gSalt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<radialGradient id="sK" cx="0.35" cy="0.32" r="0.75"><stop offset="0" stop-color="#d9c6ff"/><stop offset="0.45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></radialGradient>
<radialGradient id="sNa" cx="0.35" cy="0.32" r="0.75"><stop offset="0" stop-color="#fff1c2"/><stop offset="0.45" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></radialGradient>
<radialGradient id="sSi" cx="0.35" cy="0.32" r="0.8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9aa3b2"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.18"/></filter>

<linearGradient id="rod" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6472"/><stop offset="0.45" stop-color="#c9d1dc"/><stop offset="1" stop-color="#4a525e"/></linearGradient>
<linearGradient id="mold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7686"/><stop offset="1" stop-color="#3b4452"/></linearGradient>
<linearGradient id="pc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd38d"/><stop offset="1" stop-color="#e8a33d"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="899" height="499" fill="#ffffff" stroke="#d9dde3"/>
<text x="32" y="46" font-size="27" font-weight="700" fill="#151a22" letter-spacing="-0.3">A molded curved panel: three layers, one tool</text>
<text x="32" y="76" font-size="17" fill="#5b6474">Continental, Kunststoffe international 2/2020. Prototype panels with two 12.3-inch AMOLEDs.</text>
<rect x="24" y="98" width="470" height="382" rx="10" fill="#f7f9fb" stroke="#d9dde3"/>
<rect x="60.0" y="158.0" width="280.0" height="22.0" fill="#7c3aed" rx="3"/>
<rect x="60.0" y="180.0" width="280.0" height="200.0" fill="url(#pc)" />
<rect x="60.0" y="380.0" width="280.0" height="42.0" fill="#475569" />
<text x="352.0" y="174.0" font-size="16" fill="#7c3aed" text-anchor="start" font-weight="700" >hard layer 15 μm</text>
<text x="352.0" y="196.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >IMD, UV cured</text>
<text x="352.0" y="270.0" font-size="16" fill="#b45309" text-anchor="start" font-weight="700" >PC core 2.1 mm</text>
<text x="352.0" y="292.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >injection compression</text>
<text x="352.0" y="400.0" font-size="16" fill="#475569" text-anchor="start" font-weight="700" >film 375 μm</text>
<text x="352.0" y="422.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >printed, FIM</text>
<text x="44.0" y="452.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500" >Total about 2.5 mm, 350 g. Layers not to scale.</text>
<rect x="506" y="98" width="370" height="382" rx="10" fill="#f7f9fb" stroke="#d9dde3"/>
<text x="526.0" y="132.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700" >Process values</text>
<text x="526.0" y="170.0" font-size="16" fill="#5b6474" text-anchor="start" font-weight="600" >Film preform</text>
<text x="642.0" y="170.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="700" >150 °C, about 60 bar</text>
<text x="526.0" y="206.0" font-size="16" fill="#5b6474" text-anchor="start" font-weight="600" >Melt</text>
<text x="642.0" y="206.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="700" >up to 300 °C</text>
<text x="526.0" y="242.0" font-size="16" fill="#5b6474" text-anchor="start" font-weight="600" >Tool</text>
<text x="642.0" y="242.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="700" >over 16 t</text>
<text x="526.0" y="278.0" font-size="16" fill="#5b6474" text-anchor="start" font-weight="600" >Clamp</text>
<text x="642.0" y="278.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="700" >up to 1,500 t</text>
<text x="526.0" y="314.0" font-size="16" fill="#5b6474" text-anchor="start" font-weight="600" >Filling</text>
<text x="642.0" y="314.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="700" >tool slightly open, then closed</text>
<text x="526.0" y="350.0" font-size="16" fill="#5b6474" text-anchor="start" font-weight="600" >Target life</text>
<text x="642.0" y="350.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="700" >10 years, 300,000 km</text>
<line x1="526.0" y1="384.0" x2="856.0" y2="384.0" stroke="#d9dde3" stroke-width="1" />
<text x="526.0" y="414.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="600" >Covestro film: coat 1→3 μm lifts pencil</text>
<text x="526.0" y="436.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="600" >hardness B→1H. 3→6 μm adds nothing</text>
<text x="526.0" y="458.0" font-size="15.5" fill="#151a22" text-anchor="start" font-weight="600" >and forms worse (US9994718B2).</text>
</svg>