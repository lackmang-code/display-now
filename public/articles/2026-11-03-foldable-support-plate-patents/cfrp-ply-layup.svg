<text x="698.0" y="262.0" font-size="13" fill="#151a22" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">neutral plane: 0</text>
<text x="690.0" y="446.0" font-size="14" fill="#151a22" text-anchor="middle" font-weight="600">bending strain across the fold</text>
<text x="846.0" y="185.0" font-size="13" fill="#151a22" text-anchor="start" font-weight="500"></text>
<text x="32.0" y="530.0" font-size="14" fill="#151a22" text-anchor="start" font-weight="500">Outer plies carry the largest strain. Their fibers run along the fold axis, so the strain crosses the fibers through</text>
<text x="32.0" y="550.0" font-size="14" fill="#151a22" text-anchor="start" font-weight="500">the resin instead of stretching the stiff fibers. Cross plies sit near the neutral plane and give stiffness.</text>
<text x="32.0" y="584.0" font-size="13" fill="#5b6474" text-anchor="start" font-weight="500">Layup as described in Samsung Display KR103005271B1 (2021); same outer-ply rule in LG Display KR20240106353A (2022). Schematic.</text>
