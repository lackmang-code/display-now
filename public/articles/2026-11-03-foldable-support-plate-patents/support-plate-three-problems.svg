<text x="32.0" y="46.0" font-size="27" fill="#151a22" text-anchor="start" font-weight="700">One set of openings, three new problems</text>
<text x="32.0" y="74.0" font-size="17" fill="#5b6474" text-anchor="start" font-weight="500">Cross-sections of the folding band: screen on top, support plate below</text>
<text x="32.0" y="122.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700">1  Show-through</text>
<text x="32.0" y="146.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500">opening edges print through</text>
<text x="32.0" y="165.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500">the screen as faint lines</text>
<text x="312.0" y="122.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700">2  Debris</text>
<text x="312.0" y="146.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500">particles get into the</text>
<text x="312.0" y="165.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500">openings under the fold</text>
<text x="592.0" y="122.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700">3  Pen signal</text>
<text x="592.0" y="146.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500">a metal plate blocks the</text>
<text x="592.0" y="165.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="500">digitizer's magnetic field</text>
