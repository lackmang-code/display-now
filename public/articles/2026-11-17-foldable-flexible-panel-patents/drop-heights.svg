<line x1="598.6" y1="706.0" x2="598.6" y2="886.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="598.6" y="906.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">8</text>
<line x1="732.9" y1="706.0" x2="732.9" y2="886.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="732.9" y="906.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">12</text>
<text x="800.0" y="928.0" font-size="15" fill="#5b6474" text-anchor="end" font-weight="400">Pen drop height at bright spot (cm)</text>
<text x="318.0" y="731.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">No opening</text>
<rect x="330.0" y="710.0" width="251.8" height="30.0" fill="#dc2626" rx="3" />
<text x="589.8" y="731.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">≈ 7.5 cm</text>
<text x="318.0" y="775.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">To 2nd semiconductor</text>
<rect x="330.0" y="754.0" width="282.0" height="30.0" fill="#b45309" rx="3" />
<text x="620.0" y="775.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">≈ 8.4 cm</text>
<text x="318.0" y="819.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">To 1st semiconductor</text>
<rect x="330.0" y="798.0" width="332.4" height="30.0" fill="#b45309" rx="3" />
<text x="670.4" y="819.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">≈ 9.9 cm</text>
<text x="318.0" y="863.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">To lower metal</text>
<rect x="330.0" y="842.0" width="419.6" height="30.0" fill="#15803d" rx="3" />
<text x="757.6" y="863.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">≈ 12.5 cm</text>
