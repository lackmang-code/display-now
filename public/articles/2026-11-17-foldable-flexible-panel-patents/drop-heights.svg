<text x="318.0" y="485.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">Composite stack only</text>
<rect x="330.0" y="464.0" width="201.4" height="30.0" fill="#b45309" rx="3" />
<text x="539.4" y="485.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">6 cm</text>
<text x="318.0" y="529.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">Groove only</text>
<rect x="330.0" y="508.0" width="235.0" height="30.0" fill="#b45309" rx="3" />
<text x="573.0" y="529.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">7 cm</text>
<text x="318.0" y="573.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">Groove + stack</text>
<rect x="330.0" y="552.0" width="302.1" height="30.0" fill="#15803d" rx="3" />
<text x="640.1" y="573.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">9 cm</text>
<text x="40.0" y="666.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700">(c) Deeper opening in the inorganic layer, later bright spot</text>
<text x="40.0" y="690.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="400">KR20240144713A, opening depth</text>
<line x1="330.0" y1="706.0" x2="330.0" y2="886.0" stroke="#e6e9ee" stroke-width="1.5" />
