<svg viewBox="0 0 900 960" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans KR', Inter, system-ui, sans-serif">
<rect x="0.0" y="0.0" width="900.0" height="960.0" fill="#fff" rx="0" />
<text x="40.0" y="48.0" font-size="27" fill="#151a22" text-anchor="start" font-weight="700">How high a drop the panel survives</text>
<text x="40.0" y="80.0" font-size="17" fill="#5b6474" text-anchor="start" font-weight="400">Heights from two Samsung Display filings. Test setups differ; compare within a panel only.</text>
<text x="40.0" y="130.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700">(a) Wider slit in the support plate, lower ball drop</text>
<text x="40.0" y="154.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="400">KR20250039551A</text>
<line x1="330.0" y1="170.0" x2="330.0" y2="306.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="330.0" y="326.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">0</text>
<line x1="464.3" y1="170.0" x2="464.3" y2="306.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="464.3" y="326.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">4</text>
<line x1="598.6" y1="170.0" x2="598.6" y2="306.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="598.6" y="326.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">8</text>
<line x1="732.9" y1="170.0" x2="732.9" y2="306.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="732.9" y="326.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">12</text>
<text x="800.0" y="348.0" font-size="15" fill="#5b6474" text-anchor="end" font-weight="400">Ball drop height (cm)</text>
<text x="318.0" y="195.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">Slit 200 µm</text>
<rect x="330.0" y="174.0" width="67.1" height="30.0" fill="#dc2626" rx="3" />
<text x="405.1" y="195.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">≈ 2 cm</text>
<text x="318.0" y="239.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">Slit 100 µm</text>
<rect x="330.0" y="218.0" width="201.4" height="30.0" fill="#b45309" rx="3" />
<text x="539.4" y="239.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">≈ 6 cm</text>
