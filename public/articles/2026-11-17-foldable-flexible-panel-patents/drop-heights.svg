<text x="606.6" y="283.0" font-size="16" fill="#151a22" text-anchor="start" font-weight="700">≈ 8 cm</text>
<text x="40.0" y="376.0" font-size="19" fill="#151a22" text-anchor="start" font-weight="700">(b) Groove and composite stack, pen drop to crack</text>
<text x="40.0" y="400.0" font-size="15" fill="#5b6474" text-anchor="start" font-weight="400">KR20240144713A. Stack: organic and inorganic layers in turn</text>
<line x1="330.0" y1="416.0" x2="330.0" y2="596.0" stroke="#e6e9ee" stroke-width="1.5" />
