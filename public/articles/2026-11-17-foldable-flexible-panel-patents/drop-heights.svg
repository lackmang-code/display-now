<line x1="464.3" y1="416.0" x2="464.3" y2="596.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="464.3" y="616.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">4</text>
<line x1="598.6" y1="416.0" x2="598.6" y2="596.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="598.6" y="616.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">8</text>
<line x1="732.9" y1="416.0" x2="732.9" y2="596.0" stroke="#e6e9ee" stroke-width="1.5" />
<text x="732.9" y="616.0" font-size="15" fill="#5b6474" text-anchor="middle" font-weight="400">12</text>
<text x="800.0" y="638.0" font-size="15" fill="#5b6474" text-anchor="end" font-weight="400">Pen drop height at first crack (cm)</text>
<text x="318.0" y="441.0" font-size="16" fill="#151a22" text-anchor="end" font-weight="400">No groove, no stack</text>
